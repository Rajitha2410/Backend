<!DOCTYPE html>
<html>
<body>
    <h2>Create a User Object</h2>
    <pre id="output"></pre>

    <script>
        const name = "Bala";
        const age = 25;
        const role = "Developer";

        const user = {
            name,
            age,
            role
        };

        document.getElementById("output").innerText =
            JSON.stringify(user, null, 4);
    </script>
</body>
</html>
