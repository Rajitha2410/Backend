<!DOCTYPE html>
<html>
<head>
    <title>Student Grade</title>
</head>
<body>
    <script>
        let marks = 82;

        if (marks >= 90) {
            document.write("Grade: A+");
        } else if (marks >= 75) {
            document.write("Grade: A");
        } else if (marks >= 60) {
            document.write("Grade: B");
        } else if (marks >= 50) {
            document.write("Grade: C");
        } else {
            document.write("Grade: Fail");
        }
    </script>
</body>
</html>
