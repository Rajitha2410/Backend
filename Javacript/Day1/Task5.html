<!DOCTYPE html>
<html>
<head>
    <title>Positive, Negative or Zero</title>
</head>
<body>
    <script>
        let number = -10;

        if (number > 0) {
            document.write("Positive");
        } else if (number < 0) {
            document.write("Negative");
        } else {
            document.write("Zero");
        }
    </script>
</body>
</html>
